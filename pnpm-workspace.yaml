packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
# 依赖全部钉死精确版本；DSH 生态的 pnpm minimumReleaseAge 默认按 1440 分钟（1 天）拦截新发布，
# 这里逐条登记本包钉死的确切版本，保证首次安装不会被“发布未满 1 天”挡下。
minimumReleaseAgeExclude:
  - 'dsh-cost-meter@1.9.58'
  - '@linxin666/dsh-client-ui-git-graph@0.4.14'
  - '@michengai/dsh-btw@1.3.5'
  - '@michengai/dsh-simplify@1.0.7'
  - '@michengai/dsh-code-review@1.0.8'
  - '@michengai/dsh-codex-ui@2.0.19'
  - 'dsh-context@0.82.2'
  - 'dshmarket@1.73.14'
  - 'dsh-chief@1.4.0'
  - 'dsh-live-compact@1.1.12'
  - 'dsh-drawai@0.4.8'
  - 'dsh-computer-use-ljl454@1.50.1'
  - '@hxhxh/dsh-tray-restart@0.3.1'
  - '@dsh-packforge/dsh-pack-plugin@0.3.5'
  - '@furongjun1999/dsh-memory@0.11.1'
