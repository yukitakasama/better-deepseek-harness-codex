name: Release

# A release is eligible only after both reusable gates pass:
# PR CI and Release preflight. The tag/version is always read from manifest.json.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pr-ci:
    name: PR CI gate
    uses: ./.github/workflows/pr-ci.yml

  release-preflight:
    name: Release preflight gate
    uses: ./.github/workflows/release-preflight.yml

  release:
    name: Publish release
    needs: [pr-ci, release-preflight]
    if: >-
      ${{ needs.pr-ci.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against nested home/ payload (issue #1 regression)
        run: |
          HITS=$(find home -mindepth 2 -type d -name home 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::nested home/ directories in the home/ payload - these become dead data under DSH_HOME:"
            echo "$HITS"
            exit 1
          fi

      - name: Read manifest metadata
        id: meta
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          NAME=$(python3 -c "import json; print(json.load(open('manifest.json'))['name'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  Name: $NAME  Tag: v$VERSION"

      - name: Determine release channel
        id: channel
        run: |
          if grep -qxF "${{ steps.meta.outputs.version }}" docs/prerelease-versions.txt 2>/dev/null; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.meta.outputs.version }} is registered as a pre-release."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.meta.outputs.tag }} already exists - skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .dspack and .sha256
        if: steps.check.outputs.exists == 'false'
        run: python3 scripts/build-dspack.py . .

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          NAME="${{ steps.meta.outputs.name }}"
          DSPACK="$NAME-$VERSION.dspack"
          NOTES="docs/release-notes-v$VERSION.md"
          ARGS=(release create "$TAG" --title "$TAG" --target main)
          if [ -f "$NOTES" ]; then
            ARGS+=(--notes-file "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi
          if [ "${{ steps.channel.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          ARGS+=("$DSPACK" "$DSPACK.sha256")
          gh "${ARGS[@]}"
