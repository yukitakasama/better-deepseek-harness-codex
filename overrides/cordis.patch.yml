# 更好的 deepseek harness（codex 风格）· profile patch 层
# 包标识：better-deepseek-harness-codex
#
# 本文件由整合包携带，安装时落在 profile 根目录，作为「最后一层」应用
# （dsh 的 profile patch 永远排在每个 bundle 层之后）。
#
# ── 为什么这一层是空的 ────────────────────────────────────────────────
# 本包的插件组合已经由 bundle 层栈自身完成了全部挂载与收敛关系，
# 不需要任何跨插件的补丁。实测验证（dsh --dump-config）确认：
#
#   1. @michengai/dsh-codex-ui 在它自己的 bundle patch 里就声明了
#        - id: ui-sidebar            disabled: true
#        - id: ui-settings-general   disabled: true
#        - id: session-title-llm     disabled: true
#      并由自己重建 Codex 风格侧栏与设置页。这是它的设计意图，
#      不应在此被覆盖或"修回来"。
#
#   2. codex-ui 会重新提供（re-provide）下游插件依赖的插槽：
#        · sidebar.footer.action  → dsh-cost-meter 的余额/费用卡片
#        · settings.section       → dsh-cost-meter 与 dsh-whale-girl-pet 的设置分区
#      因此「官方侧栏被禁用」不会让这些插件失去落点。
#
#   3. 其余 9 个插件各自只 insert 一行 host row，或注册独立插槽
#      （如 ui-git-graph、ui-effort-slider），彼此不争抢同一插槽。
#
#   4. 桌宠 dsh-whale-girl-pet 走浮动浮层（position:fixed），
#      不占用侧栏插槽，与 codex-ui 的侧栏改造无冲突。
#
# ── patch 语义提醒（重要）────────────────────────────────────────────
# loader patch 对已存在条目是「逐键覆盖」而非深合并：
#   · 只带 `config:` 的补丁不会清掉其它键（如 disabled）——安全；
#   · 但一旦写了 `disabled:`，就会整体替换该键的现值。
# 所以在这一层补 `disabled: false` 之类操作会静默撤销上游意图，
# 需要重启后逐一核对。改动前请先跑 `dsh --profile <name> --dump-config`。
#
# ── 如何自定义 ───────────────────────────────────────────────────────
# 在下方数组里按 loader patch 语法追加条目即可，例如调整某插件 config、
# disable 掉不想要的插件行。bundle 层栈顺序由 package.json 的
# dsh.profile.bundles 决定，本文件始终最后生效。
#
# ── 唯一一条必要补丁：修正 dsh-computer-use-win 的 MCP 路径 ──────────────
# 该插件自带的 bundle patch 用 `new URL('mcp/server.mjs', baseUrl)` 定位自己的
# MCP 服务器，注释里假设 baseUrl 是「该 patch 文件所在目录」。但 dsh 实际把
# baseUrl 设为 **profile 根目录**（见 dsh-app-boot 中
# `ctx.baseUrl = pathToFileURL(dirname(absoluteConfigPath)).href + "/"`）。
#
# 后果：单包 profile 下恰好能跑（包目录≈profile 根），但在多插件 profile 里
# 会解析成 <profile>/mcp/server.mjs → MODULE_NOT_FOUND，MCP 起不来，
# 模型看不到 mcp__wincu__* 工具。实测 boot 报错即为此。
#
# 修法：profile 根下的 node_modules 正是依赖安装位置，故用
# node_modules/dsh-computer-use-win/mcp/server.mjs 相对 baseUrl 重新锚定。
# 这里覆盖的是 args 键，不影响 serverName / transport 等其余配置。
- id: mcp-dsh-computer-use-win
  name: "@deepseek-ai/dsh-mcp-client"
  config:
    serverName: wincu
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-computer-use-win/mcp/server.mjs', baseUrl))"
    toolCallTimeoutMs: 60000
    failOnStartupError: false

# ── QQ 机器人频道（@tencent-connect/dsh-qqbot）：默认关闭 ─────────────────
# 该插件是「按需启用」的功能 —— 用它的前提是已有 QQ 机器人的 AppID/AppSecret。
# 上游实现在凭据缺失时会于 apply() 内同步等待扫码：那个 Promise 没有超时、
# 二维码过期只是一直刷新，而 cordis 串行加载插件 → 整个 dsh 实例永远停在
# 「等待就绪」（启动器启动窗口一直转圈、Web 服务始终不监听）。
#
# 本包改用 fork 版 yukitakasama/dsh-qqbot（凭据缺失时跳过而非阻塞），但默认
# 仍关闭：需要时再打开，避免无谓加载一个没配凭据的频道。
#
# 启用步骤：
#   1. 拿凭据 —— 在 profile 目录下跑 `npx dsh-qqbot-bind` 扫码绑定一次，或在
#      QQ 开放平台创建机器人后设置 QQBOT_APPID / QQBOT_SECRET；
#   2. 打开 —— 启动器「插件」页把 im-qqbot 设为启用并重启实例，或把下面
#      这行的 disabled 改成 false。
- id: im-qqbot
  disabled: true

# ── Codex 风格 Computer Use（dsh-computer-use）：工具行 + 独立 preset ─────────
# 该插件把能力拆成两个平面：
#   · HOST 平面（`computer-use` 行，由插件自带的 cordis.patch.yml 提供）
#     —— 进程级桌面 sidecar：指针、覆盖层、截图、批准流、回合生命周期；
#   · PRESET 平面（`dsh-computer-use/tool` 行）
#     —— 13 个 window2 工具，必须挂在 agent preset 里才对模型可见。
#
# 插件自己只带 HOST 那一行（它的注释明确写了「Tools stay in the user agent preset
# so standard coding sessions do not get the mouse」）。整合包要补下面这段，
# 否则模型拿不到任何 computer use 工具 —— 插件装了等于没装。
#
# 为什么用 `- insert:` 新增一个独立 preset，而不是往 preset-standard 里塞：
# loader patch 对已存在的 preset 条目是「整体替换它的 plugins 数组」而不是追加。
# 实测把 preset-standard 的 config.plugins 写一次，标准 preset 的 32 行会被压缩成
# 你写的那几行，等于废掉整个默认工作台。新增一个 preset 则完全不碰既有预设。
#
# 隔离意图：普通编码会话（standard / ptc preset）永远不会拿到鼠标；
# 只有显式选「Computer Use」preset 新建的会话才有桌面工具。
#
# 与 dsh-computer-use-win 的关系：两者可以共存（工具名不同、preset 不同），
# 但**不要在同一会话里同时驱动桌面**，否则两套指针/覆盖层会互相打架。
- insert:
    - id: preset-computer-use
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: computer-use
        name: Computer Use
        description: Codex-style desktop control (window2 tools with a visible cursor overlay and an Esc interrupt)
        # 排在官方 standard(1) / ptc(2) 之后，作为「按需选用」的第三方预设。
        order: 3
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              # 必填项：官方 preset 同样显式给值，缺了它会以 ValidationError 拒绝整个 preset。
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          # PRESET 平面：13 个 window2 工具 + computer_use_health / _experience。
          # 消费 HOST 平面的 `dshComputerUse` sidecar，自身不发布服务，因此不需要隔离域。
          - id: tool-computer-use
            name: dsh-computer-use/tool
            config:
              surfaces:
                - computer
              browserSkill: computer-use-browser
