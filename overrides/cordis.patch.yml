# better-deepseek-harness-codex profile patch
#
# The incompatible or unverified plugins from v3.0.0 were removed from the
# package entirely. Their old patch rows are intentionally gone as well, so a
# patch cannot reintroduce a module that is no longer installed.
#
# Keep the official PowerShell sandbox quiet on non-Windows hosts.
- id: pwsh-sandbox
  name: "@deepseek-ai/dsh-pwsh-sandbox"
  disabled: !!js process.platform !== 'win32'
